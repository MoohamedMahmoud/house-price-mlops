services:
  house-price-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: house-price-api

    ports:
      - "8000:8000"

    environment:
      MODEL_PATH: /app/models/lasso_model.joblib

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s