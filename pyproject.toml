[project]
name = "house-price-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed MMES", email = "mohamedmahmoud2022.333@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.124.4",
    "matplotlib>=3.7.5",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "pydantic>=2.10.6",
    "scikit-learn>=1.3.2",
    "seaborn>=0.13.2",
    "structlog>=25.5.0",
    "uvicorn>=0.33.0",
]

[project.scripts]
house-price-mlops = "house_price_mlops:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
